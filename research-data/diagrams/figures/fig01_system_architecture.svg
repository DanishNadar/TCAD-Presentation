<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif">
 <defs>
  <marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker>
  <marker id="r" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d62728"/></marker>
  <marker id="g" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888"/></marker>
  <style>.b{stroke:#444;stroke-width:1.2}.t{font-size:13px;font-weight:bold;text-anchor:middle;fill:#111}.s{font-size:10.5px;text-anchor:middle;fill:#222}.l{font-size:10px;fill:#555}</style>
 </defs>
 <rect width="900" height="470" fill="#fff"/>
 <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">T-CAD system architecture: models never read ground truth; it flows only to evaluation</text>

 <!-- column 1 -->
 <rect class="b" x="20" y="70" width="170" height="80" rx="8" fill="#e8eef7"/><text class="t" x="105" y="98">Simulation</text><text class="s" x="105" y="116">world, motion, scenarios,</text><text class="s" x="105" y="130">ground truth (protected)</text>
 <rect class="b" x="20" y="200" width="170" height="80" rx="8" fill="#dbe8fb"/><text class="t" x="105" y="228">Synthetic sensors</text><text class="s" x="105" y="246">2D ray-cast LiDAR,</text><text class="s" x="105" y="260">radar, camera detector</text>
 <rect class="b" x="20" y="330" width="170" height="80" rx="8" fill="#fbe3e3"/><text class="t" x="105" y="358">Fault injection</text><text class="s" x="105" y="376">bounded synthetic contradictions</text><text class="s" x="105" y="390">+ benign faults</text>

 <!-- column 2-3 -->
 <rect class="b" x="255" y="70" width="310" height="80" rx="8" fill="#fff4d6"/><text class="t" x="410" y="92">Evaluation &amp; logging</text><text class="s" x="410" y="108" fill="#d62728" style="fill:#b3261e;font-weight:bold">ground truth allowed here only</text><text class="s" x="410" y="124">labels, metrics, bootstrap CIs, per-vehicle /</text><text class="s" x="410" y="138">per-entity exports, figures, PyGame UI</text>
 <rect class="b" x="220" y="200" width="165" height="80" rx="8" fill="#dbe8fb"/><text class="t" x="302" y="228">Local perception</text><text class="s" x="302" y="246">per vehicle: polygon map →</text><text class="s" x="302" y="260">ROI grid, detections, tracks</text>
 <rect class="b" x="410" y="200" width="155" height="80" rx="8" fill="#eeeeee"/><text class="t" x="487" y="228">V2V network</text><text class="s" x="487" y="246">discrete-event delay, loss,</text><text class="s" x="487" y="260">ordering, clock error</text>

 <!-- models column -->
 <rect class="b" x="610" y="62" width="145" height="64" rx="8" fill="#eeeeee"/><text class="t" x="682" y="88">Sync / align</text><text class="s" x="682" y="106">motion compensation</text>
 <rect class="b" x="610" y="150" width="145" height="70" rx="8" fill="#dddddd"/><text class="t" x="682" y="176">CAD (A0)</text><text class="s" x="682" y="194">occupancy + spoof +</text><text class="s" x="682" y="208">remove checks</text>
 <rect class="b" x="610" y="244" width="145" height="70" rx="8" fill="#e6dcf4"/><text class="t" x="682" y="270">Bayesian LOO</text><text class="s" x="682" y="288">calibrated likelihoods,</text><text class="s" x="682" y="302">tempered fusion</text>
 <rect class="b" x="610" y="338" width="145" height="70" rx="8" fill="#d9c8f0"/><text class="t" x="682" y="364">CAD-HMM</text><text class="s" x="682" y="382">forward filters,</text><text class="s" x="682" y="396">temporal surprise</text>
 <rect class="b" x="785" y="210" width="100" height="120" rx="8" fill="#f6d0cd"/><text class="t" x="835" y="242">T-CAD</text><text class="t" x="835" y="258">decision</text><text class="s" x="835" y="280">rule / logistic</text><text class="s" x="835" y="294">layer, CAD alert</text><text class="s" x="835" y="308">kept, abstention</text>

 <!-- data flow -->
 <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
  <path d="M105 150V197"/>
  <path d="M190 240H217"/>
  <path d="M385 240H407"/>
  <path d="M190 370H487V283"/>
  <path d="M565 240H587V94H607"/>
  <path d="M682 126V147"/><path d="M682 220V241"/><path d="M682 314V335"/>
  <path d="M755 185H770V250H782"/>
  <path d="M755 279H782"/>
  <path d="M755 373H770V310H782"/>
 </g>
 <text class="l" x="112" y="178">world state</text>
 <text class="l" x="300" y="364">injected into shared messages</text>

 <!-- ground truth: evaluation only -->
 <path d="M190 110H252" stroke="#d62728" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
 <text x="222" y="103" font-size="9.5" fill="#d62728" text-anchor="middle">ground truth</text>
 <!-- decisions to evaluation -->
 <path d="M835 210V44H410V67" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
 <text class="l" x="418" y="60">alerts and scores (for metrics)</text>

 <text x="880" y="458" font-size="10" fill="#777" text-anchor="end">architectural diagram of the implemented code base (src/tcad) · redrawn for legibility</text>
</svg>
