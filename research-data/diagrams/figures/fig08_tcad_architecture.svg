 <rect class="b" x="25" y="182" width="265" height="46" rx="8" fill="#e6dcf4"/><text class="t" x="157" y="210">A2 Bayesian LOO</text>
 <rect class="b" x="25" y="242" width="265" height="46" rx="8" fill="#d9c8f0"/><text class="t" x="157" y="270">A3 CAD-HMM (per source)</text>
 <rect class="b" x="25" y="302" width="265" height="46" rx="8" fill="#cdb4ea"/><text class="t" x="157" y="330">A4 Bayes + HMM (LOO temporal)</text>

