<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Conceptual top-down intersection: a building blocks the ego vehicle's view of an object on the cross street; a partner vehicle on the cross street sees it and shares its map over V2V">
 <defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#162c40" stroke-width="1"/></pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="#ecb04b" stroke-width="2" opacity=".35"/></pattern>
  <clipPath id="map"><rect x="0" y="70" width="1000" height="550"/></clipPath>
  <marker id="v2v" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M2 2L14 8L2 14" fill="none" stroke="#54deae" stroke-width="3"/></marker>
 </defs>
 <rect width="1000" height="620" fill="#0a1626"/>
 <text x="32" y="44" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">Collaborative perception: a second viewpoint fills an occlusion</text>

 <g clip-path="url(#map)">
  <rect x="0" y="70" width="1000" height="550" fill="url(#grid)"/>
  <!-- roads (map origin shifted down by 70) -->
  <rect x="0" y="300" width="1000" height="100" fill="#2a3747"/>
  <rect x="440" y="70" width="120" height="550" fill="#2a3747"/>
  <path d="M0 350H440M560 350H1000M500 70V300M500 400V620" stroke="#a2b3c0" stroke-width="3" stroke-dasharray="22 18" opacity=".45"/>

  <!-- ego sensing range -->
  <circle cx="200" cy="350" r="230" fill="#35c6e8" opacity=".08" stroke="#35c6e8" stroke-width="2"/>
  <!-- partner field of view (looking north along the cross street) -->
  <path d="M500 520L410 90H590Z" fill="#a47df5" opacity=".13" stroke="#a47df5" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- region hidden from ego by the building (rays from ego through the building's silhouette corners) -->
  <path d="M270 110L281 70H981L410 275Z" fill="url(#hatch)" stroke="#ecb04b" stroke-width="2" stroke-dasharray="10 7"/>

  <!-- building -->
  <rect x="270" y="110" width="140" height="165" rx="10" fill="#475368" stroke="#8691a5" stroke-width="3"/>
  <text x="340" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">BUILDING</text>
  <text x="340" y="214" text-anchor="middle" font-size="14" fill="#cad1db" font-family="Arial, Helvetica, sans-serif">occluder</text>

  <!-- occluded object on the cross street -->
  <rect x="482" y="168" width="36" height="52" rx="6" fill="#f4bd5d" stroke="#ffffff" stroke-width="2"/>
  <path d="M592 246L524 204" stroke="#ffdf9e" stroke-width="1.5"/>
  <text x="598" y="254" fill="#ffdf9e" font-size="17" font-family="Arial, Helvetica, sans-serif">Object hidden from ego</text>
  <text x="598" y="276" fill="#d9c7a3" font-size="14" font-family="Arial, Helvetica, sans-serif">(inside the building's shadow)</text>

  <!-- ego (heading east) -->
  <rect x="172" y="333" width="58" height="34" rx="8" fill="#20c1e2" stroke="#ffffff" stroke-width="2"/>
  <text x="201" y="322" fill="#ffffff" font-size="17" font-weight="bold" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">EGO</text>

  <!-- partner (heading north) -->
  <rect x="483" y="500" width="34" height="56" rx="8" fill="#9573e7" stroke="#ffffff" stroke-width="2"/>
  <text x="530" y="534" fill="#ffffff" font-size="17" font-weight="bold" font-family="Arial, Helvetica, sans-serif">PARTNER</text>

  <!-- V2V message: partner shares its map with ego -->
  <path d="M478 540Q260 560 210 378" fill="none" stroke="#54deae" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#v2v)"/>
  <text x="250" y="590" fill="#b6f7d8" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">V2V: partner shares its occupancy map</text>
 </g>

 <!-- legend -->
 <g font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect x="640" y="440" width="340" height="160" rx="10" fill="#0a1626" opacity=".88" stroke="#2c425a"/>
  <rect x="658" y="460" width="22" height="14" rx="3" fill="#35c6e8" opacity=".5" stroke="#35c6e8"/><text x="692" y="472" fill="#49d2eb">Ego sensing range</text>
  <rect x="658" y="492" width="22" height="14" rx="3" fill="url(#hatch)" stroke="#ecb04b"/><text x="692" y="504" fill="#f4c16c">Occluded from ego (shadow)</text>
  <rect x="658" y="524" width="22" height="14" rx="3" fill="#a47df5" opacity=".5" stroke="#a47df5"/><text x="692" y="536" fill="#b38cff">Partner field of view</text>
  <path d="M658 563H682" stroke="#54deae" stroke-width="3.5" stroke-dasharray="7 5"/><text x="692" y="568" fill="#55dea8">V2V communication</text>
  <text x="658" y="590" fill="#8fa1b3" font-size="12.5">Conceptual sketch — not to scale, not a simulator frame</text>
 </g>
</svg>
